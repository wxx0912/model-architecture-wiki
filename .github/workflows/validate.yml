name: Validate wiki

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate pages and references
        run: python3 scripts/validate.py
      - name: Check generated index
        run: python3 scripts/build_index.py --check
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
